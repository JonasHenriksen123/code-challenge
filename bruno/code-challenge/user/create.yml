info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{connection}}/api/user"
  body:
    type: json
    data: |-
      {
        "user":{
          "name": "{{$randomFullName}}",
          "email": "{{$randomExampleEmail}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
